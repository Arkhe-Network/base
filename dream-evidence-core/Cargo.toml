[package]
name = "dream-evidence-core"
version = "0.1.1"
edition = "2021"
authors = ["Safe-Core Team <team@safe-core.io>"]
license = "MIT OR Apache-2.0"
description = "DEP v2.5 — Distributed Evidence Protocol with Byzantine fault tolerance"
repository = "https://github.com/safe-core/dream-evidence-core"
keywords = ["distributed", "evidence", "byzantine", "formal-verification", "kani"]
categories = ["cryptography", "distributed-systems"]
rust-version = "1.75"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[[bench]]
name = "protocol_bench"
harness = false

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
