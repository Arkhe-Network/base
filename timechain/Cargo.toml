
[package]
name = "timechain"
version = "0.4.0"
edition = "2021"

[dependencies]
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

aes-gcm = "0.10"
hkdf = "0.12"
sha3 = "0.10"
sha2 = "0.10"
rand = "0.8"

serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

ndarray = { version = "0.15", features = ["serde", "rayon"] }

thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
num-complex = "0.4"
rustfft = "6.1"
rayon = "1.7"

tokio = { version = "1.0", features = ["full"] }

subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }
futures = "0.3.33"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
