[package]
name = "arkhe-interop"
version = "0.1.0"
edition = "2021"
description = "Cross-crate interoperability hub for ARKHE OS"
rust-version = "1.75.0"
authors = ["Arkhe(n) Research Group <research@arkhe.org>"]
license = "MIT OR Apache-2.0"

[dependencies]
arkhe-identity = { path = "../arkhe-identity" }
arkhe-gdid = { path = "../arkhe-gdid" }
arkhe-octonions = { path = "../arkhe-octonions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
uuid = { version = "1.0", optional = true, features = ["v5", "serde"] }

[features]
default = []
json = ["serde_json"]
uuid = ["dep:uuid"]
ndarray = ["arkhe-octonions/ndarray"]