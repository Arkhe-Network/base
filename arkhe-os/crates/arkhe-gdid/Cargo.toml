[package]
name = "arkhe-gdid"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []

[dependencies]
arkhe-core = { path = "../arkhe-core" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
blake3 = "1.5"
subtle = "2.6"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
zeroize = { version = "1.8", features = ["derive"] }
bs58 = "0.5"