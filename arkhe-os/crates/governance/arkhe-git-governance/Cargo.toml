[package]
name = "arkhe-git-governance"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.10"
git2 = "0.18"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
arkhe-core = { path = "../../arkhe-core" }
blake3 = "1.5"

[dev-dependencies]
proptest = "1.4"
insta = { version = "1.39", features = ["json"] }